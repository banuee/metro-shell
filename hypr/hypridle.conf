general {
    lock_cmd = metro-lock     # guard от повторов — ВНУТРИ лаунчера (в lock_cmd нельзя:
                              # sh -c wrapper матчится pgrep-паттерном сам на себя!)
    before_sleep_cmd = loginctl lock-session       # лок перед сном (крышка/суспенд)
}

listener {
    timeout = 300                             # блокировка по таймауту 5 минут
    on-timeout = loginctl lock-session
}

listener {
    timeout = 1                               # страховка: если предсонный лок не успел
    on-resume = loginctl lock-session         # запуститься до сна — лок на пробуждении
}
