general {
    lock_cmd = metro-lock     # re-entry guard lives INSIDE the launcher (a sh -c
                              # wrapper inside lock_cmd would match its own pgrep pattern!)
    before_sleep_cmd = loginctl lock-session       # lock before sleep (lid/suspend)
}

listener {
    timeout = 300                             # lock after 5 minutes idle
    on-timeout = loginctl lock-session
}

listener {
    timeout = 1                               # fallback: if the pre-sleep lock
    on-resume = loginctl lock-session         # didn't make it — lock on wakeup
}
