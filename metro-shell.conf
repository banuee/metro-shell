# ══════════════════════════════════════════════════════════════
#  metro-shell.conf — THE single config of the whole shell
#  Source of truth: edit THIS file, not scattered qml.
#  Format like the old hyprland.conf: key = value, sections name { ... },
#  comments with #. Nesting via dots: panel { toppanel_bg = ... }
#
#  Readers:  metro-colors (themes/accent/fonts/panels), metro-theme,
#            metro-conf, wall (via metro-colors).
#  Writers:  metro-conf set <key> <value>, settings GUI
#            (theme switch, accent/wallpaper pick).
#  Apply:    metro-conf apply   (= regenerate Theme.qml of every tool +
#            update hyprland.lua; quickshell picks it up itself)
#  Status:   metro-conf status
#  Baselines: metro-colors save-defaults / metro-colors reset
#            ("remember"/"reset" buttons in settings → metro widgets)
# ══════════════════════════════════════════════════════════════

# Global theme: material | metro | wp
theme = material

# Accent: auto = from current wallpaper | #rrggbb = pinned
# (metro-colors set <hex> pins it, metro-colors set auto goes back to wallpaper)
# Out of the box — auto: color comes from stock assets/wallpapers/default.jpg
accent = auto

# ── Metro panels (top / left / right) ──
panel {
    # Panel background opacity (0.0 — invisible glass, 1.0 — solid slab)
    toppanel_bg = 0.30
    launcher_bg = 0.30
    control_bg = 0.30

    # Panel background rounding (px)
    toppanel_radius = 16
    launcher_radius = 16
    control_radius = 16
}

# ── Settings window background (metro-settings) ──
settings {
    # dark = readable dark (for metro) | frost = frosted glass like the panels
    glass = dark
}

# ── Fonts (apply to the metro theme; material/wp have their own identity) ──
fonts {
    family = Segoe UI Variable Static Text
    headline = Segoe UI Variable Static Display Light
    icon = NotoSans Nerd Font
}

# ── Compositor (written into hyprland.lua on apply/theme switch) ──
compositor {
    rounding = 24
    blur = true
}
